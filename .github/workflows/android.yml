name: Android CI

# Poterx TV: unit tests + lint, then a locked APK. The account comes from repository secrets
# (POTERX_PLAYLIST_URL or POTERX_SERVER/USERNAME/PASSWORD) or from the "Run workflow" form, which
# wins over the secrets so one repo can build an APK per customer. Without either the APK is an
# unlocked, stock-OwnTV build.
#
# Core (tv.own.owntv:core, :player-core) and the mpv engine resolve from OwnTV's public Maven
# repository, https://ahxn00.github.io/OwnTV_Core/maven — no token needed.

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Linijka playlisty (http://host:port/playlist/USER/PASS/m3u_plus lub get.php?username=…). Puste = sekrety repo."
        required: false
        type: string
      apk_label:
        description: "Dopisek do nazwy APK, np. nazwa klienta"
        required: false
        type: string

permissions:
  contents: write   # tag builds publish a Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            # Dev builds: pinned HIGH so they always install over any published release.
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Resolve the locked account
        env:
          INPUT_PLAYLIST_URL: ${{ inputs.playlist_url }}
          SECRET_PLAYLIST_URL: ${{ secrets.POTERX_PLAYLIST_URL }}
          SECRET_SERVER: ${{ secrets.POTERX_SERVER }}
          SECRET_USERNAME: ${{ secrets.POTERX_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.POTERX_PASSWORD }}
        run: |
          # The form field wins over the secrets. Everything is masked so it never shows in the log.
          if [ -n "$INPUT_PLAYLIST_URL" ]; then
            echo "::add-mask::$INPUT_PLAYLIST_URL"
            echo "POTERX_PLAYLIST_URL=$INPUT_PLAYLIST_URL" >> "$GITHUB_ENV"
            echo "Locked account: from the workflow form."
          elif [ -n "$SECRET_PLAYLIST_URL" ]; then
            echo "POTERX_PLAYLIST_URL=$SECRET_PLAYLIST_URL" >> "$GITHUB_ENV"
            echo "Locked account: from the POTERX_PLAYLIST_URL secret."
          elif [ -n "$SECRET_SERVER" ] && [ -n "$SECRET_USERNAME" ] && [ -n "$SECRET_PASSWORD" ]; then
            echo "POTERX_SERVER=$SECRET_SERVER" >> "$GITHUB_ENV"
            echo "POTERX_USERNAME=$SECRET_USERNAME" >> "$GITHUB_ENV"
            echo "POTERX_PASSWORD=$SECRET_PASSWORD" >> "$GITHUB_ENV"
            echo "Locked account: from the POTERX_SERVER/USERNAME/PASSWORD secrets."
          else
            echo "::warning::No POTERX_* secret and no form input — building an UNLOCKED (stock OwnTV) APK."
          fi

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing: repository keystore."
          else
            # A locked APK must still be a RELEASE build (R8 shrinks and obfuscates it), so without a
            # keystore secret a throw-away key is made here. Such an APK installs fine, but the next
            # build's key differs, so an update needs an uninstall first. Add the KEYSTORE_* secrets
            # for installs that update in place.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storepass poterxci -keypass poterxci \
              -alias poterx -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Poterx TV CI" >/dev/null 2>&1
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=poterxci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=poterx" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=poterxci" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret — signed with a throw-away CI key (updates need an uninstall)."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardRelease --stacktrace
          ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          echo "Built: $ARM_SRC"
          echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"

      - name: Name the APK
        env:
          LABEL: ${{ inputs.apk_label }}
        run: |
          mkdir -p dist
          SUFFIX=""
          if [ -n "$LABEL" ]; then SUFFIX="-$(echo "$LABEL" | tr -cs 'A-Za-z0-9_.-' '_')"; fi
          if [ "$IS_TAG" = "true" ]; then
            OUT="PoterxTV-v${{ steps.ver.outputs.name }}${SUFFIX}.apk"
            cp "$ARM_SRC" "dist/PoterxTV.apk"
          else
            OUT="PoterxTV-dev-${GITHUB_SHA::7}${SUFFIX}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm64-v8a + armeabi-v7a)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Poterx TV ${{ github.ref_name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/PoterxTV.apk
          generate_release_notes: true
